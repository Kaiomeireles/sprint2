name: CI/CD - Azure App Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Auditoria de dependências (falha em severidade alta)
        run: npm audit --audit-level=high

      - name: Preparar pacote de produção
        run: |
          npm ci --omit=dev
          mkdir -p dist
          cp -r app.js server.js package.json package-lock.json index.html config.js css js docs node_modules dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: dist
          include-hidden-files: false

  deploy:
    name: Deploy no Azure
    needs: build-test
    if: github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacote
          path: dist

      - name: Deploy
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: dist

      - name: Teste de fumaça (/health)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.webapp-url }}/health" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Aplicação não respondeu 200 em /health"; exit 1
